services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: breakdown
      POSTGRES_USER: breakdown
      POSTGRES_PASSWORD: breakdown
    volumes:
      - breakdown_db:/var/lib/postgresql/data
    networks: [internal]
  web:
    build: .
    environment:
      DATABASE_URL: postgresql://breakdown:breakdown@db:5432/breakdown
    depends_on: [db]
    ports:
      - "3000:3000"
    networks: [internal]
    restart: unless-stopped
networks:
  internal:
volumes:
  breakdown_db: